      const r=$('input',l);if(s.self[c]===k)r.checked=true;r.onchange=()=>{s.self[c]=k;save();build()};f.appendChild(l)});rb.appendChild(f)});
  const rf=el('div','blk');rf.innerHTML=`<label class="ask" for="refl">이번 탐구에서 가장 크게 배운 점, 더 알고 싶은 점을 적어 보세요.</label><textarea id="refl"></textarea>`;
  const rt=$('textarea',rf);rt.value=s.refl||'';rt.oninput=()=>{s.refl=rt.value;save();build()};rb.appendChild(rf);w.appendChild(rb);
  /* 보고서 본문 */
  const out=el('section','rep');out.style.marginTop='18px';w.appendChild(out);
  const act=el('div','nav');const cp=el('button','btn','보고서 글 복사');cp.type='button';const bk=el('button','btn sec2','← 탐구로 돌아가기');bk.type='button';bk.onclick=()=>go({n:'theme',id:th.id});act.append(bk,cp);w.appendChild(act);
  const ta=el('textarea');ta.readOnly=true;ta.style.cssText='margin-top:10px;min-height:10em;font-family:var(--f-mono);font-size:12.5px';ta.setAttribute('aria-label','복사용 보고서 글');w.appendChild(ta);

    const qok=qz.filter(b=>s.quiz[b.id]&&s.quiz[b.id].ok).length;
    const ex=[];th.steps.forEach(stp=>stp.b.forEach(b=>{if(b.k==='exam')b.items.forEach(i=>ex.push(i))}));
    const eok=ex.filter(i=>s.exam[i.src]&&s.exam[i.src].ok).length;

    L.push(`3. 개념 확인 문제: ${qok}/${qz.length} 정답`);L.push('');
    L.push(`4. 기출 문항 결과: ${eok}/${ex.length} 정답`);ex.forEach(i=>{const e=s.exam[i.src];L.push(`- [${srcKind(i.src)}] ${i.src} (${i.pt}): ${e&&e.ok?'정답':e&&e.done?'오답(시도 '+e.tries+'회)':'미풀이'}${e&&e.work?'\n  풀이: '+e.work.replace(/\n/g,'\n  '):''}`)});L.push('');
    L.push('5. 스스로 점검');th.std.forEach(c=>L.push(`- 10공수2-${c}: ${s.self[c]?s.self[c]+' 수준 — '+STD[c][s.self[c].toLowerCase()]:'(선택 안 함)'}`));L.push('');

    <h3>스스로 점검</h3><ul>${th.std.map(c=>`<li>10공수2-${c}: ${s.self[c]?'<b>'+s.self[c]+'</b> 수준':'<span class="src">선택 안 함</span>'}</li>`).join('')}</ul>`}

  cp.onclick=()=>{build();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('보고서 글을 복사했어요'),doCopy)}else doCopy()};

/* ───────── 제출 파일: 학생 활동 요약 (선생님이 교사용 파일로 불러옴) ───────── */
function metrics(th,s){
  let qn=0,qk=0,retry=false,an=0,ak=0,en=0,ek=0,ed=0,work=false,tkn=0;const asks=[];
  if(s.tok)TOK_FIELDS.forEach(k=>{if(String(s.tok[k]||'').trim())tkn++});
  th.steps.forEach(st=>(st.b||[]).forEach(b=>{
    if(b.k==='quiz'){qn++;const q=s.quiz[b.id];if(q&&q.ok){qk++;if(q.tries>1)retry=true}}
    if(b.k==='ask'){an++;const a=(s.ask[b.id]||'').trim();if(a){ak++;asks.push(a.slice(0,200))}}
    if(b.k==='exam')b.items.forEach(i=>{en++;const e=s.exam[i.src];if(e&&e.ok)ek++;if(e&&e.done)ed++;if(e&&e.work&&e.work.trim().length>10)work=true})}));
  const refl=!!(s.refl&&s.refl.trim());
  if(!(ak+qk+ed+s.log.length+tkn)&&!refl)return null;
  return {q:[qk,qn],e:[ek,en],a:[ak,an],tk:[tkn,5],log:s.log.length,retry,work,refl,self:s.self||{},asks:[],rt:''};  
}
function payloadOf(th,s){const a={},q={},e={};
  th.steps.forEach(st=>(st.b||[]).forEach(b=>{
    if(b.k==='ask'){const t=(s.ask[b.id]||'').trim();if(t)a[b.id]=t.slice(0,600)}
    if(b.k==='quiz'){const x=s.quiz[b.id];if(x&&x.tries)q[b.id]=[x.ok?1:0,x.tries]}
    if(b.k==='exam')b.items.forEach(i=>{const x=s.exam[i.src];if(x&&x.done)e[i.src]=[x.ok?1:0,x.tries||1,(x.work||'').trim().slice(0,400)]})}));
  let k=null;const T=s.tok;if(T&&(T.pick!=null||[...TOK_FIELDS,'o'].some(x=>String(T[x]||'').trim())))k={p:T.pick,ev:String(T.ev||'').trim().slice(0,400),f:['f1','f2','f3','f4'].map(x=>String(T[x]||'').trim().slice(0,200)),o:String(T.o||'').trim().slice(0,200)};
  return {a,q,e,l:(s.log||[]).slice(0,8).map(x=>String(x).slice(0,200)),r:(s.refl||'').trim().slice(0,500),k}}
function recordOf(src){const t={},ft={};Object.keys(src.t||{}).forEach(id=>{const th=byId(id);if(!th)return;const ts=TSof(src,id),m=metrics(th,ts);if(m){t[id]=m;ft[id]=ts}});const nm=(src.name||'').slice(0,40);return {name:nm,updated:Date.now(),t,full:{name:nm,t:ft}}}
const TSof=(src,id)=>{const s=src.t[id];return {step:0,ask:{},quiz:{},exam:{},log:[],self:{},...s}};

function dlFile(name,text,type){try{const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast('파일을 저장하지 못했어요')}}
/* ── 제출 파일: 이름·활동 전체를 한 줄 문자열로 묶음 (압축 + 확인용 검사값) ── */
const chk=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(16).padStart(8,'0')};
const b64s=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
async function pipe(bytes,stream){const r=new Response(new Blob([bytes]).stream().pipeThrough(stream));return new Uint8Array(await r.arrayBuffer())}
async function encodeCode(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));let mode='p',out=raw;
  try{if(typeof CompressionStream==='function'){out=await pipe(raw,new CompressionStream('deflate-raw'));mode='z'}}catch(e){out=raw;mode='p'}
  const body=b64s(out);return 'TG2:'+mode+body+'.'+chk(mode+body)}

function submitView(w){
  const cr=el('nav','crumb');const hb=el('button',null,'홈');hb.type='button';hb.onclick=()=>go({n:'home'});cr.append(hb,document.createTextNode(' › 제출 파일'));w.appendChild(cr);
  const hd=el('div','th-h');hd.innerHTML='<h1>선생님께 내는 제출 파일</h1><div class="tg">지금까지의 활동을 파일 하나로 저장해 줍니다. 저장된 파일을 선생님이 안내한 곳(클래스룸 등)에 올려 제출하세요.</div>';w.appendChild(hd);
  const rec=recordOf(S),ids=Object.keys(rec.t);
  const box=el('div');box.style.cssText='display:flex;flex-direction:column;gap:12px;margin-top:14px';w.appendChild(box);
  if(!(S.name||'').trim())box.appendChild(el('div','callout warn','위쪽 「이름」 칸에 <b>학번 이름</b>을 먼저 써 주세요. 이름이 없으면 선생님이 누구의 기록인지 알 수 없어요.'));
  const sm=el('div','callout');sm.innerHTML=ids.length?`<b>포함되는 활동 ${ids.length}개</b><br>${ids.map(id=>{const th=byId(id),m=rec.t[id];return esc(th.title)+' — 탐구질문 '+m.a[0]+'/'+m.a[1]+', 기출 '+m.e[0]+'/'+m.e[1]+', 개념 '+m.q[0]+'/'+m.q[1]+', 관찰기록 '+m.log+'개, TOK '+m.tk[0]+'/5'}).join('<br>')}`:'아직 기록된 활동이 없어요. 주제에서 활동을 한 뒤 다시 오세요.';box.appendChild(sm);
  box.appendChild(el('p','src','파일에는 이름과 내가 한 활동(쓴 답·풀이·관찰 기록·성찰·TOK 답)이 그대로 들어 있어요(읽을 수 있는 형태). 선생님에게만 내고 다른 친구에게 공유하지 마세요. 활동을 더 한 뒤에는 파일을 새로 저장해 다시 제출하면 됩니다.'));
  const bar=el('div','tc-bar');const mk=el('button','btn','제출 파일 저장하기');mk.type='button';mk.disabled=!ids.length;bar.appendChild(mk);box.appendChild(bar);
  const res=el('div','callout');res.hidden=true;box.appendChild(res);
  mk.onclick=async()=>{
    if(!(S.name||'').trim()){toast('위쪽 이름 칸에 학번과 이름을 먼저 써 주세요');const n=$('#nm');if(n)n.focus();return}
    mk.disabled=true;
    try{const r=recordOf(S);r.v=2;const c=await encodeCode(r);
      const fn='탐구노트_'+((S.name||'').trim().replace(/[\\\/:*?"<>|\s]+/g,'_'))+'.tg2';
      dlFile(fn,c);res.hidden=false;
      res.innerHTML='<b>저장했어요: '+esc(fn)+'</b><br>내려받은 폴더에서 이 파일을 찾아 선생님이 안내한 곳(클래스룸 등)에 제출하세요.<br><span class="src">크기 '+Math.max(1,Math.round(c.length/1024))+'KB · '+new Date().toLocaleString('ko-KR')+'</span>';
      toast('제출 파일을 저장했어요: '+fn)}
    catch(e){toast('파일을 만들지 못했어요')}
    mk.disabled=!ids.length};
}

/* ───────── 화면: 상단바 · 화면 전환 (학생용) ───────── */
function topbar(){
  const b=el('header','top');
  const hm=el('a','ghost','← 홈');hm.href='../#tools';hm.setAttribute('aria-label','수학 실험실 메인으로');hm.style.cssText='text-decoration:none;color:var(--ink)';
  const br=el('button','brand','<i></i>공통수학2 탐구 노트');br.type='button';br.onclick=()=>go({n:'home'});
  b.append(hm,br,el('span','sp'));
  const nm=el('label','nm','이름 <input type="text" id="nm" maxlength="20" placeholder="학번 이름" aria-label="이름">');
  const inp=$('input',nm);inp.value=S.name||'';inp.oninput=()=>{S.name=inp.value;save()};
  b.appendChild(nm);
  const sb=el('button','ghost','제출 파일');sb.type='button';sb.onclick=()=>go({n:'submit'});
  if(view.n==='submit'){sb.style.borderColor='var(--accent)';sb.setAttribute('aria-current','page')}
  b.appendChild(sb);
  const th=el('button','ghost','화면 밝기');th.type='button';th.setAttribute('aria-label','밝은 화면과 어두운 화면 바꾸기');
  th.onclick=()=>{const r=document.documentElement,cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    const nx=cur==='dark'?'light':'dark';r.setAttribute('data-theme',nx);store.set('tg2.theme',nx);
    window.dispatchEvent(new Event('themechange'));$$('canvas.cv').forEach(c=>c.dispatchEvent(new Event('themechange')))};
  b.appendChild(th);return b}
function go(v,noScroll){view=v;render();if(!noScroll)window.scrollTo(0,0)}
function render(){
  app.innerHTML='';app.appendChild(topbar());const w=el('div');app.appendChild(w);
  if(view.n==='theme'&&byId(view.id))themeView(w,byId(view.id));
  else if(view.n==='report'&&byId(view.id))reportView(w,byId(view.id));
  else if(view.n==='submit')submitView(w);
  else home(w);
  const ft=el('footer','foot');ft.innerHTML=`<b>만든이</b> ${AUTHOR} · 교과서 출처와 모의고사 출처는 각 주제와 문항에 표시했습니다.`;app.appendChild(ft)}
window.RO=false;

(function boot(){
  const t=store.get('tg2.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
  view={n:'home'};render()})();

</script>
