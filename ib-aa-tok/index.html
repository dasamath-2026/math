<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학으로 묻는 지식이론</title>
<!--
  ============================================================
  새 앱 기본 틀
  1) 이 폴더(app-template)를 복사해 영어 폴더 이름으로 바꿉니다. 예) probability
  2) 아래 "앱 제목", 상단 문구, "도구 전용" 영역만 바꿉니다.
  3) site-config.js의 TOOLS에 등록하면 홈페이지에 카드가 생깁니다.
  ※ Claude에게 맡길 때는 '연수가이드/02_프롬프트모음.md'의 [프롬프트 B]를 쓰세요.
  ============================================================
-->
<style>
  /* ===== 내 수학 실험실 공통 테마 =====
     이 :root 블록과 아래 "공통 셸" 영역은 모든 도구가 동일하게 유지합니다.
     도구별 CSS는 파일 아래쪽 "도구 전용" 영역에만 추가하세요. */
  :root{
    --bg:#f2f0e9;
    --panel:#fbf9f3;
    --panel-2:#f4f1e9;
    --line:#d8d2c7;
    --border-soft:#eee9df;
    --text:#15171a;
    --muted:#6b6f74;
    --faint:#9a958a;
    --accent:#ff5a30;
    --accent-weak:rgba(255,90,48,.14);
    --lime:#d9f24f;
    --shadow:0 10px 28px rgba(21,23,26,.055);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      linear-gradient(rgba(21,23,26,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(21,23,26,.035) 1px, transparent 1px),
      var(--bg);
    background-size:34px 34px;
    color:var(--text);
    font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    letter-spacing:-.015em;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;color:inherit}
  .num{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  .app{width:100%;max-width:1180px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}

  /* ---- 공통 셸: 상단바 ---- */
  .topbar{
    min-height:72px;
    display:flex;
    gap:14px;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    background:rgba(242,240,233,.90);
    border:1px solid var(--line);
    border-radius:18px;
    backdrop-filter:blur(14px);
  }
  .brand-area{display:flex;align-items:center;gap:18px;min-width:0}
  .home-link{
    display:flex;align-items:center;gap:10px;flex:none;
    color:var(--text);text-decoration:none;
    padding:7px 10px 7px 8px;border-radius:12px;
    transition:background .18s ease;
  }
  .home-link:hover{background:#e7e3d9}
  .home-arrow{
    width:31px;height:31px;border:1px solid #c9c4b8;border-radius:50%;
    display:grid;place-items:center;font-size:16px;line-height:1;background:#fbf9f3;
  }
  .brand-copy{display:block;line-height:1.15}
  .brand-copy strong{display:block;font-size:14px;font-weight:800;letter-spacing:-.035em}
  .brand-copy small{
    display:block;margin-top:4px;color:#8a8d90;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:7.5px;letter-spacing:.13em;white-space:nowrap;
  }
  .top-divider{width:1px;height:34px;background:#d3cec3;flex:none}
  .title-row{display:block;min-width:0}
  .eyebrow{
    display:flex;align-items:center;gap:7px;margin-bottom:4px;
    color:#7b7770;font-size:10px;font-weight:750;white-space:nowrap;
  }
  .eyebrow span{display:block;width:18px;height:2px;background:var(--accent)}
  h1{
    font-size:clamp(18px,1.25vw,24px);
    margin:0;
    font-weight:800;letter-spacing:-.04em;white-space:nowrap;
  }
  h1 em{
    font-style:normal;font-weight:500;
    background:linear-gradient(transparent 60%,var(--lime) 0);
    padding:0 .04em;
  }
  .subtitle{margin:4px 0 0;color:#666b6f;font-size:11.5px}
  .badge{
    display:inline-flex;align-items:center;gap:7px;flex:none;
    background:#15171a;color:#fff;border:0;
    border-radius:999px;padding:8px 12px;font-weight:700;font-size:12px;white-space:nowrap;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#73c48f}

  /* ---- 공통 셸: 패널 ----
     기본은 "넓은 그림 영역 + 좁은 설정 영역" 2단입니다.
     패널 수가 다르면 grid-template-columns만 바꾸고, 좁은 화면에서 1단으로
     떨어지는 @media (max-width:900px) 규칙은 남겨 두세요. */
  .workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:10px}
  .panel{
    min-width:0;
    display:flex;flex-direction:column;
    background:rgba(251,249,243,.96);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .panel-head{
    flex:0 0 auto;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    background:rgba(247,244,236,.92);
  }
  .panel-title{
    font-size:15px;font-weight:800;letter-spacing:-.025em;
    position:relative;padding-left:10px;
  }
  .panel-title::before{
    content:"";position:absolute;left:0;top:.15em;bottom:.15em;
    width:3px;border-radius:3px;background:var(--accent);
  }
  .panel-desc{color:#74716b;font-size:11.5px;margin-top:5px;line-height:1.45}
  .panel-body{flex:1;min-height:0;padding:14px}

  /* ---- 공통 셸: 버튼 ---- */
  .btn{
    border:1px solid #c9c4b8;background:#fbf9f3;color:#15171a;
    border-radius:999px;font-weight:700;font-size:12.5px;
    padding:9px 14px;cursor:pointer;line-height:1;
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px);border-color:#15171a;background:#f2efe6}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.primary{background:#15171a;color:#fff;border-color:#15171a}
  .btn.primary:hover:not(:disabled){background:#2b2e31}
  .btn.danger{color:#a73b2c}
  .btn.icon-btn{width:38px;height:38px;padding:0;border-radius:10px;font-size:18px;display:grid;place-items:center}

  /* ---- 공통 셸: 그림 영역 (캔버스·SVG) ---- */
  .chart-wrap{background:#fff;border:1px solid #e3ded4;border-radius:12px;overflow:hidden;position:relative}
  .chart-wrap canvas,.chart-wrap svg{display:block;width:100%;height:100%}

  /* ---- 공통 셸: 입력·지표·안내 (쓰지 않는 것은 지우세요) ---- */
  .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .control{display:flex;flex-direction:column;gap:5px}
  .control label{font-size:11px;color:var(--muted);font-weight:800}
  .control input{
    width:100%;padding:9px 10px;font-weight:700;
    border:1px solid #d3cec3;background:#fff;color:var(--text);border-radius:10px;
  }
  .control input:focus{outline:3px solid rgba(217,242,79,.42);border-color:#9aa64b}
  .control input[type="range"]{
    padding:0;height:22px;border:0;border-radius:0;background:transparent;
    accent-color:#15171a;cursor:pointer;
  }
  .checkbox-control{
    justify-content:center;min-height:58px;padding:8px 10px;
    border:1px solid var(--line);background:var(--panel-2);border-radius:12px;
  }
  .checkbox-control label{display:flex;align-items:center;gap:8px;color:var(--text);cursor:pointer;font-size:11px}
  .checkbox-control input{width:17px;height:17px;padding:0;accent-color:#15171a;cursor:pointer}

  .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .metric{background:var(--panel-2);border:1px solid #ddd7cc;border-radius:11px;padding:8px 9px;min-width:0}
  .metric .label{color:#77736d;font-size:10px;font-weight:800;margin-bottom:3px}
  .metric .value{
    font-size:15px;font-weight:850;color:var(--text);
    font-variant-numeric:tabular-nums;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .formula{
    background:#15171a;color:#f6f2e9;border:1px solid #15171a;border-radius:12px;
    padding:9px 10px;line-height:1.55;font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow:auto;
  }
  .note{
    padding:10px 12px;border-radius:10px;
    background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    font-size:11px;line-height:1.5;
  }
  .note b{color:#7c2d12;font-weight:800}
  .status{min-height:19px;font-size:11px;line-height:1.4;font-weight:750;color:var(--muted)}
  .status.ok{color:#32724f}
  .status.error{color:#b44634}

  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .legend-item i{width:11px;height:11px;border-radius:3px;flex:none}

  /* ---- 공통 셸: 반응형 (이 3개 블록은 그대로 유지) ----
     주의: .topbar에 align-items:stretch를 쓰면 알약 모양 .badge가
     줄바꿈된 제목 높이만큼 세로로 늘어나 거대한 원처럼 깨집니다. */
  @media (max-width:1080px){
    .brand-copy small{display:none}
    .brand-copy strong{font-size:13px}
    .top-divider{height:28px}
  }
  @media (max-width:900px){
    .workspace{grid-template-columns:1fr}
  }
  @media (max-width:820px){
    .topbar{align-items:flex-start}
    .brand-area{align-items:flex-start}
    .home-link{padding-left:2px}
    .top-divider{display:none}
    .brand-copy{display:none}
    .title-row{display:block}
    h1{white-space:normal}
    .eyebrow{white-space:normal}
    .badge{display:none}
  }
  @media (max-width:520px){
    .app{padding:7px}
    .topbar{border-radius:14px;padding:9px 10px}
    .home-arrow{width:34px;height:34px}
    h1{font-size:20px;line-height:1.25}
    .subtitle{font-size:11px;white-space:normal}
    .panel{border-radius:14px}
    .panel-head{padding:12px}
    .btn{min-height:40px}
    .controls{grid-template-columns:1fr}
  }


  /* ===== 도구 전용 CSS는 여기부터 ===== */
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .section-label{font-size:11px;color:var(--muted);font-weight:800}
  .tab{border:1px solid #c9c4b8;background:#fbf9f3;border-radius:999px;padding:8px 14px;font-weight:800;font-size:12.5px;cursor:pointer}
  .tab.on{background:#15171a;color:#fff;border-color:#15171a}
  .hero{padding:16px 18px;background:rgba(251,249,243,.96);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .hero h2{margin:0 0 6px;font-size:20px;letter-spacing:-.04em}
  .hero p{margin:6px 0 0;color:#4a4d52;font-size:13px;line-height:1.7;max-width:80ch}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid #c9c4b8;background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .chip.on{background:#15171a;color:#fff;border-color:#15171a}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .card{
    text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;cursor:pointer;
    display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s;
  }
  .card:hover{border-color:#15171a;transform:translateY(-1px)}
  .card .no{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--accent);font-weight:800}
  .card .t{font-weight:850;font-size:15px;letter-spacing:-.03em}
  .card .kq{font-size:12px;color:#5d6166;line-height:1.55}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
  .pill{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--panel-2);border:1px solid #ddd7cc;color:#5d6166}
  .pill.done{background:#e4f4ea;border-color:#b9dfc6;color:#2f6d47}
  .pill.mid{background:#fff3df;border-color:#f3d6a6;color:#8a5a14}
  .bridge{width:100%;border-collapse:collapse;font-size:12.5px}
  .bridge th,.bridge td{border-bottom:1px solid var(--border-soft);padding:8px 8px;text-align:left;vertical-align:top;line-height:1.5}
  .bridge th{font-size:11px;color:var(--muted);background:var(--panel-2)}
  .crit{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
  .crit div{background:var(--panel-2);border:1px solid #ddd7cc;border-radius:11px;padding:9px 10px;font-size:12px;line-height:1.5}
  .crit b{display:block;font-size:12.5px;margin-bottom:2px}
  .crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .crumb button{border:0;background:none;padding:0;color:var(--accent);font-weight:800;cursor:pointer;font-size:12px}
  .topic-head{padding:14px 16px;background:rgba(251,249,243,.96);border:1px solid var(--line);border-radius:var(--radius)}
  .topic-head h2{margin:2px 0 8px;font-size:21px;letter-spacing:-.04em}
  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
  .fact{background:#fff;border:1px solid #e3ded4;border-radius:11px;padding:9px 11px;font-size:12.5px;line-height:1.55}
  .fact b{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
  .fact.kq{border-color:var(--accent);background:#fff8f5}
  .fact.kq b{color:var(--accent)}
  .stack{display:flex;flex-direction:column;gap:12px}
  .lab-box{display:flex;flex-direction:column;gap:10px}
  .ro{background:#15171a;color:#f6f2e9;border-radius:12px;padding:9px 11px;font-size:12px;line-height:1.65;
      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-x:auto}
  .ro b{color:#d9f24f}
  .ro .warn{color:#ffb199}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sl{display:flex;flex-direction:column;gap:3px;min-width:150px;flex:1}
  .sl span{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:800}
  .sl output{font-family:ui-monospace,Consolas,monospace;color:var(--text)}
  .sl input{accent-color:#15171a;width:100%}
  .seg{display:inline-flex;border:1px solid #c9c4b8;border-radius:999px;overflow:hidden;background:#fbf9f3;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer}
  .seg button.on{background:#15171a;color:#fff}
  .ck{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;cursor:pointer}
  .ck input{accent-color:#15171a;width:16px;height:16px}
  .cvw{background:#fff;border:1px solid #e3ded4;border-radius:12px;overflow:hidden;position:relative}
  .cvw canvas{display:block;width:100%;height:100%;touch-action:none}
  .tbl-wrap{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
  .tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl th,.tbl td{padding:5px 8px;border-bottom:1px solid var(--border-soft);text-align:right;font-variant-numeric:tabular-nums}
  .tbl th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);font-size:11px}
  .tbl td:first-child,.tbl th:first-child{text-align:center}
  .tbl tr.hit td{background:var(--accent-weak);font-weight:800}
  .tbl tr.dim td{color:#a8a39a}
  .nest{border:1.5px solid #d3cec3;border-radius:12px;padding:20px 8px 8px;position:relative;background:#fff}
  .nest>.lb{position:absolute;left:10px;top:3px;font-size:11px;font-weight:800;color:#8a857b}
  .nest.need{border-color:var(--accent);background:#fff6f2}
  .nest.need>.lb{color:var(--accent)}
  .nest.out{background:#f6f4ef}
  .doors{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .door{width:84px;height:116px;border-radius:10px 10px 4px 4px;border:2px solid #15171a;background:#f3d6a6;
        font-weight:900;font-size:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .door small{font-size:11px;font-weight:800}
  .door.pick{outline:4px solid var(--accent);outline-offset:2px}
  .door.open{background:#fff;cursor:default}
  .bars{display:flex;flex-direction:column;gap:6px}
  .bar{display:grid;grid-template-columns:120px 1fr 120px;gap:8px;align-items:center;font-size:12px}
  .bar .tr{height:16px;background:var(--panel-2);border:1px solid #ddd7cc;border-radius:6px;position:relative;overflow:hidden}
  .bar .fl{position:absolute;inset:0 auto 0 0;background:#15171a}
  .bar .th{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
  .bar .v{font-family:ui-monospace,Consolas,monospace;text-align:right}
  .refl label{display:block;font-size:12px;font-weight:800;margin:10px 0 4px}
  .refl label.qopt{display:flex;margin:6px 0 0;font-weight:500;font-size:12.5px}
  .refl label.ck{display:flex;margin:0;font-weight:700;align-items:flex-start;line-height:1.5}
  .refl label.ck input{margin-top:2px;flex:none}
  .refl textarea{width:100%;min-height:58px;padding:9px 10px;border:1px solid #d3cec3;border-radius:10px;background:#fff;
                 font:inherit;font-size:13px;line-height:1.55;resize:vertical}
  .refl textarea:focus{outline:3px solid rgba(217,242,79,.42);border-color:#9aa64b}
  .qopt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;
        font-size:12.5px;line-height:1.5;cursor:pointer;margin-top:6px}
  .qopt input{margin-top:3px;accent-color:#15171a}
  .qopt.on{border-color:#15171a;background:#fbf9f3}
  .qopt .src{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
  .sentence{background:#fff;border:1px dashed #c9c4b8;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.75}
  .sentence .blank{color:#b2ada2}
  .sentence mark{background:linear-gradient(transparent 55%,var(--lime) 0);color:inherit}
  .loglist{margin:0;padding-left:1.2em;font-size:12px;line-height:1.6}
  .loglist li{margin-bottom:4px}
  .loglist button{border:0;background:none;color:#b44634;cursor:pointer;font-size:12px;margin-left:4px}
  .bank-group h3{font-size:15px;margin:4px 0 6px}
  .bank-unit{font-size:12px;font-weight:850;color:var(--accent);margin:10px 0 4px}
  .bank-q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.6;margin-bottom:6px}
  .bank-q .k{font-size:10.5px;font-weight:850;color:var(--muted);margin-right:6px}
  .bank-q .k.im{color:#2f6fd6}
  .bank-q .links{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
  .bank-q .links button{border:1px solid #c9c4b8;background:#fbf9f3;border-radius:999px;font-size:11px;font-weight:700;padding:3px 9px;cursor:pointer}
  .search{width:100%;padding:10px 12px;border:1px solid #d3cec3;border-radius:10px;background:#fff;font:inherit;font-size:13px}
  .report{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.7;
          background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:520px;overflow:auto}
  .name-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .name-row input{padding:9px 10px;border:1px solid #d3cec3;border-radius:10px;background:#fff;font:inherit;font-weight:700;min-width:200px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#15171a;color:#fff;padding:10px 16px;border-radius:999px;
         font-size:13px;font-weight:700;z-index:50;box-shadow:var(--shadow)}

const ROBS = new ResizeObserver(es => es.forEach(e => e.target._draw && e.target._draw()));

function axes(g, W, H, dpr, o) {
  const L = (o.padL ?? 40) * dpr, R = 10 * dpr, T = 10 * dpr, B = (o.padB ?? 24) * dpr;
  const X = x => L + (x - o.xmin) / (o.xmax - o.xmin) * (W - L - R);
  const Y = y => T + (o.ymax - y) / (o.ymax - o.ymin) * (H - T - B);
  g.font = `${10 * dpr}px ui-monospace,Consolas,monospace`; g.lineWidth = dpr;
  const sx = niceStep(o.xmax - o.xmin, Math.max(3, Math.round(W / dpr / 80)));
  const sy = niceStep(o.ymax - o.ymin, Math.max(3, Math.round(H / dpr / 50)));
  g.strokeStyle = "#eee9df"; g.fillStyle = "#9a958a";
  g.textAlign = "center"; g.textBaseline = "top";
  for (let x = Math.ceil(o.xmin / sx) * sx; x <= o.xmax + 1e-9; x += sx) {
    g.beginPath(); g.moveTo(X(x), T); g.lineTo(X(x), H - B); g.stroke(); g.fillText(tickLabel(x), X(x), H - B + 4 * dpr);
  }
  g.textAlign = "right"; g.textBaseline = "middle";
  for (let y = Math.ceil(o.ymin / sy) * sy; y <= o.ymax + 1e-9; y += sy) {
    g.beginPath(); g.moveTo(L, Y(y)); g.lineTo(W - R, Y(y)); g.stroke(); g.fillText(tickLabel(y), L - 5 * dpr, Y(y));
  }
  g.strokeStyle = "#b9b3a7";
  if (o.ymin <= 0 && o.ymax >= 0) { g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); }
  if (o.xmin <= 0 && o.xmax >= 0) { g.beginPath(); g.moveTo(X(0), T); g.lineTo(X(0), H - B); g.stroke(); }

/* 02·04 구면 삼각형 */
LABS.sphere = (host, api, opt) => {
  let th = 90;
  const ctl = el("div", "row"); host.appendChild(ctl);
  const cv = canvas(host, "4 / 3", draw);
  slider(ctl, "꼭짓점 C의 각 θ (적도 위 두 점의 경도 차)", 1, 179, 1, th, v => v + "°", v => { th = v; cv.redraw(); up(); });
  const ro = el("div", "ro"); host.appendChild(ro);
  if (opt && opt.axiom) host.appendChild(el("div", "note",
    "<b>평행선 공리 바꾸기</b> 평면(유클리드 기하)에서는 ‘직선 밖의 한 점을 지나 그 직선과 만나지 않는 직선이 꼭 하나 있다’를 가정합니다. 구면에서 ‘직선’ 역할을 하는 대원(구의 중심을 지나는 원)은 어느 두 개를 골라도 반드시 만납니다. 즉 평행선이 없습니다. 이 가정 하나가 바뀌자 삼각형의 내각의 합에 대한 결론도 바뀝니다."));
  function P(lat, lon, mid) {
    const t = 0.38, la = lat * Math.PI / 180, lo = (lon - mid) * Math.PI / 180;
    const x = Math.cos(la) * Math.sin(lo), y = Math.sin(la), z = Math.cos(la) * Math.cos(lo);
    return [x, y * Math.cos(t) - z * Math.sin(t), y * Math.sin(t) + z * Math.cos(t)];
  }
  function draw(g, W, H, dpr) {
    const r = Math.min(W, H) * 0.42, cx = W / 2, cy = H / 2 + r * 0.05, mid = th / 2;
    const S = p => [cx + r * p[0], cy - r * p[1]];
    g.fillStyle = "#f7f5ef"; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#b9b3a7"; g.lineWidth = 1.2 * dpr; g.stroke();
    const arc = (pts, color, w, dashBack) => {
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1], front = a[2] >= 0 && b[2] >= 0;
        g.strokeStyle = color; g.lineWidth = w; g.setLineDash(front ? [] : dashBack);
        if (!front && !dashBack.length) continue;
        g.beginPath(); g.moveTo(...S(a)); g.lineTo(...S(b)); g.stroke();
      }
      g.setLineDash([]);
    };
    const range = (a, b, n, f) => Array.from({ length: n + 1 }, (_, i) => f(a + (b - a) * i / n));
    // 위도선(적도) 전체, 경선 몇 개
    arc(range(0, 360, 120, l => P(0, l, mid)), "#cfc9bd", dpr, [3 * dpr, 4 * dpr]);
    for (let l = 0; l < 360; l += 45) arc(range(-90, 90, 60, a => P(a, l + mid, mid)), "#e6e1d7", dpr, []);
    // 삼각형: 북극 N → 경도 0 적도 A → 경도 θ 적도 B → N
    const e1 = range(90, 0, 60, a => P(a, 0, mid)), e2 = range(0, th, 80, l => P(0, l, mid)), e3 = range(0, 90, 60, a => P(a, th, mid));
    const poly = e1.concat(e2, e3);
    g.beginPath(); poly.forEach((p, i) => { const s = S(p); i ? g.lineTo(...s) : g.moveTo(...s); }); g.closePath();
    g.fillStyle = "rgba(255,90,48,.18)"; g.fill();
    [e1, e2, e3].forEach(e => arc(e, "#ff5a30", 2.5 * dpr, [4 * dpr, 4 * dpr]));
    const N = S(P(90, 0, mid)), A = S(P(0, 0, mid)), B = S(P(0, th, mid));
    [[N, "C (북극)"], [A, "A"], [B, "B"]].forEach(([p, t]) => {
      dot(g, p[0], p[1], 4.5 * dpr, "#15171a", "#fff", 1.5 * dpr);
      g.font = `800 ${12 * dpr}px sans-serif`; g.fillStyle = "#15171a"; g.textAlign = "center"; g.textBaseline = "bottom";
      g.fillText(t, p[0], p[1] - 7 * dpr);
    });
    g.font = `700 ${11 * dpr}px ui-monospace,Consolas,monospace`; g.fillStyle = "#c2401f"; g.textBaseline = "top";
    g.fillText("90°", A[0] + 18 * dpr, A[1] - 22 * dpr); g.fillText("90°", B[0] - 18 * dpr, B[1] - 22 * dpr);
    g.fillText("θ=" + th + "°", N[0], N[1] + 8 * dpr);
  }
  function up() {
    ro.innerHTML = `구면 삼각형 ABC: 90° + 90° + ${th}° = <b>${180 + th}°</b> (평면이라면 언제나 180°)<br>` +
      `180°보다 큰 만큼(${th}°)은 삼각형 넓이에 비례합니다: 구 겉넓이의 ${fmt(th / 720 * 100, 1)}%`;
  }
  up();
  api.readout = () => `구면에서 각 C가 ${th}°인 삼각형의 내각의 합은 ${180 + th}°로 180°보다 ${th}° 크다.`;
};

/* 03 n²+n+41 */
LABS.primes = (host, api) => {
  let K = 10;
  const isPrime = m => { if (m < 2) return false; for (let d = 2; d * d <= m; d++) if (m % d === 0) return false; return true; };
  const factor = m => { const f = []; for (let d = 2; d * d <= m; d++) while (m % d === 0) { f.push(d); m /= d; } if (m > 1) f.push(m); return f.join(" × "); };
  const ctl = el("div", "row"); host.appendChild(ctl);
  slider(ctl, "확인할 n의 최댓값", 0, 45, 1, K, v => "n = 0 ~ " + v, v => { K = v; draw(); });
  const tw = el("div", "tbl-wrap"); host.appendChild(tw);
  const ro = el("div", "ro"); host.appendChild(ro);
  function draw() {
    let first = -1, rows = "";
    for (let n = 0; n <= K; n++) {
      const v = n * n + n + 41, p = isPrime(v);
      if (!p && first < 0) first = n;
      rows += `<tr class="${p ? "" : "hit"}"><td>${n}</td><td>${v.toLocaleString("ko-KR")}</td><td>${p ? "소수" : "합성수 = " + factor(v)}</td></tr>`;
    }
    tw.innerHTML = `<table class="tbl"><thead><tr><th>n</th><th>n² + n + 41</th><th>판정</th></tr></thead><tbody>${rows}</tbody></table>`;
    tw.scrollTop = tw.scrollHeight;
    ro.innerHTML = first < 0
      ? `n = 0부터 ${K}까지 <b>${K + 1}개 모두 소수</b>입니다. 그렇다면 모든 n에서 소수라고 말해도 될까요?`
      : `n = 0부터 ${first - 1}까지 ${first}개는 모두 소수였지만,<br><b>n = ${first}</b>에서 ${first * first + first + 41} = ${factor(first * first + first + 41)} → <span class="warn">반례</span>`;
  }
  draw();
  api.readout = () => { const ok = K < 40; return ok ? `n=0~${K}의 ${K + 1}개 사례에서 n²+n+41은 모두 소수였다.` : `n=0~39의 40개 사례는 모두 소수였지만 n=40에서 1681=41×41로 반례가 나왔다.`; };
};

/* 05 몬티 홀 */
LABS.monty = (host, api) => {

      b.type = "button"; b.setAttribute("aria-label", `${i + 1}번 문`);

        st.open = goats[Math.floor(Math.random() * goats.length)];
        st.phase = 1; st.msg = `진행자가 ${st.open + 1}번 문을 열어 염소를 보여 줍니다. 선택을 바꿀까요?`; drawDoors();
      };

        st.msg = (win ? "자동차를 얻었습니다!" : "염소였습니다.") + ` (내 기록: 유지 ${mine.stay[0]}/${mine.stay[1]}승, 바꾸기 ${mine.swap[0]}/${mine.swap[1]}승)`; drawDoors(); };
      s1.onclick = () => fin("stay", st.pick); s2.onclick = () => fin("swap", other);
      act.append(s1, s2);
    }
    if (st.phase === 2) { const n = el("button", "btn", "한 판 더"); n.type = "button"; n.onclick = newGame; act.appendChild(n); }
    msg.textContent = st.msg;
  }
  host.appendChild(el("div", "section-label", "모의실험 (컴퓨터가 여러 번 대신 해 보기)"));
  const ctl = el("div", "row"); host.appendChild(ctl);
  seg(ctl, [["know", "진행자가 자동차 위치를 안다"], ["rand", "진행자가 아무 문이나 연다"]], rule, k => { rule = k; drawBars(); });
  const run = n => {
    const R = sim[rule];
    for (let t = 0; t < n; t++) {
      const car = Math.floor(Math.random() * 3), pick = Math.floor(Math.random() * 3);
      let open;
      if (rule === "know") { const g = [0, 1, 2].filter(d => d !== pick && d !== car); open = g[Math.floor(Math.random() * g.length)]; }
      else { const g = [0, 1, 2].filter(d => d !== pick); open = g[Math.floor(Math.random() * 2)]; if (open === car) continue; } // 자동차가 열리면 이 판은 제외
      const other = [0, 1, 2].find(d => d !== pick && d !== open);

/* 06 식·표·그래프 */
LABS.repr = (host, api) => {
  const f = x => x ** 3 - 2 * x, xm = -Math.sqrt(2 / 3);
  let h = 1, showD = false;
  host.appendChild(el("div", "formula", "식: f(x) = x³ − 2x"));
  const ctl = el("div", "row"); host.appendChild(ctl);
  seg(ctl, [[1, "표 간격 1"], [0.5, "간격 0.5"], [0.1, "간격 0.1"]], h, k => { h = k; draw(); });
  check(ctl, "미분으로 극대 확인", showD, v => { showD = v; draw(); });
  const tw = el("div", "tbl-wrap"); tw.style.maxHeight = "150px"; host.appendChild(tw);
  const cv = canvas(host, "16 / 9", (g, W, H, dpr) => {
    const o = { xmin: -2.2, xmax: 2.2, ymin: -3, ymax: 3 };
    const m = axes(g, W, H, dpr, o);
    curve(g, f, o, m, "#15171a", 2.2 * dpr);
    tableX().forEach(x => dot(g, m.X(x), m.Y(f(x)), 3.5 * dpr, "#2f6fd6"));
    const bt = bestTable(); dot(g, m.X(bt), m.Y(f(bt)), 6 * dpr, null, "#2f6fd6", 2 * dpr);
    if (showD) { dot(g, m.X(xm), m.Y(f(xm)), 6 * dpr, "#ff5a30", "#fff", 2 * dpr); }
  });
  const ro = el("div", "ro"); host.appendChild(ro);
  const tableX = () => { const a = []; for (let i = 0; Math.round((-2 + i * h) * 1000) / 1000 <= 2; i++) a.push(Math.round((-2 + i * h) * 1000) / 1000); return a; };
  const bestTable = () => { let b = -2; tableX().filter(x => x <= 0).forEach(x => { if (f(x) > f(b)) b = x; }); return b; };
  function draw() {
    const xs = tableX(), bt = bestTable();
    tw.innerHTML = `<table class="tbl"><thead><tr><th>x</th>${xs.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody><tr><td>f(x)</td>${xs.map(x => `<td style="${x === bt ? "background:var(--accent-weak);font-weight:800" : ""}">${fmt(f(x), 3)}</td>`).join("")}</tr></tbody></table>`;
    tw.querySelectorAll("th,td").forEach(c => c.style.textAlign = "center");
    cv.redraw();
    ro.innerHTML = `간격 ${h}인 표에서 x ≤ 0 중 가장 큰 값: x = <b>${bt}</b>, f(x) = ${fmt(f(bt), 3)}` +
      (showD ? `<br>f′(x) = 3x² − 2 = 0 → 실제 극대: x = −√(2/3) ≈ <b>${fmt(xm, 4)}</b>, f(x) ≈ ${fmt(f(xm), 4)}` : "<br>표와 그래프만으로 극대의 위치를 정확히 말할 수 있을까요?");
  }
  draw();
  api.readout = () => `f(x)=x³−2x: 간격 ${h}인 표에서는 x=${bestTable()}에서 가장 커 보였고, 미분하면 실제 극대는 x=−√(2/3)≈−0.8165이다.`;
};

/* 07 조건부확률과 언어 */
LABS.cond = (host, api) => {
  let prev = 1, sens = 99, spec = 99;
  const ctl = el("div", "row"); host.appendChild(ctl);
  const up = () => { cv.redraw(); text(); };
  slider(ctl, "유병률 (전체 중 질병이 있는 사람)", 0.1, 30, 0.1, prev, v => fmt(v, 1) + "%", v => { prev = v; up(); });
  slider(ctl, "민감도 P(양성 | 질병)", 50, 99.9, 0.1, sens, v => fmt(v, 1) + "%", v => { sens = v; up(); });
  slider(ctl, "특이도 P(음성 | 건강)", 50, 99.9, 0.1, spec, v => fmt(v, 1) + "%", v => { spec = v; up(); });
  const calc = () => {
    const N = 10000, D = N * prev / 100, TP = D * sens / 100, FN = D - TP, Hh = N - D, FP = Hh * (1 - spec / 100), TN = Hh - FP;
    return { N, D, TP, FN, FP, TN, ppv: TP / (TP + FP) };
  };
  const cv = canvas(host, "5 / 2", (g, W, H, dpr) => {
    const c = calc(), cols = 50, rows = 20, n = cols * rows, k = n / c.N; // 1000칸 = 10000명 (1칸 = 10명)
    const cw = W / cols, ch = H / rows;
    const cnt = [c.TP * k, c.FN * k, c.FP * k, c.TN * k].map(Math.round);
    const colors = ["#ff5a30", "#ffd2c4", "#2f6fd6", "#efebe2"];
    let idx = 0;
    cnt.forEach((m, ci) => { for (let j = 0; j < m && idx < n; j++, idx++) { const x = idx % cols, y = Math.floor(idx / cols); g.fillStyle = colors[ci]; g.fillRect(x * cw + dpr, y * ch + dpr, cw - 2 * dpr, ch - 2 * dpr); } });
    while (idx < n) { const x = idx % cols, y = Math.floor(idx / cols); g.fillStyle = colors[3]; g.fillRect(x * cw + dpr, y * ch + dpr, cw - 2 * dpr, ch - 2 * dpr); idx++; }
  });
  host.appendChild(el("div", "legend",
    `<span class="legend-item"><i style="background:#ff5a30"></i>질병 · 양성</span><span class="legend-item"><i style="background:#ffd2c4"></i>질병 · 음성</span><span class="legend-item"><i style="background:#2f6fd6"></i>건강 · 양성</span><span class="legend-item"><i style="background:#efebe2;border:1px solid #ccc"></i>건강 · 음성</span><span class="legend-item">한 칸 = 10명 (모두 10,000명)</span>`));
  const ro = el("div", "ro"); host.appendChild(ro);
  host.appendChild(el("div", "note", "<b>또 하나의 언어 문제: ‘또는’</b> 식당에서 “커피 또는 차”는 보통 둘 중 하나만 고르라는 뜻입니다. 수학의 A ∪ B(A 또는 B)는 둘 다인 경우도 포함합니다. 같은 낱말이 맥락에 따라 다른 뜻을 가질 때, 기호는 그 뜻을 하나로 고정합니다."));
  function text() {
    const c = calc();
    ro.innerHTML = `P(양성 | 질병) = <b>${fmt(sens, 1)}%</b>  ← ‘검사의 정확도’<br>P(질병 | 양성) = ${fmt(c.TP, 0)} ÷ (${fmt(c.TP, 0)} + ${fmt(c.FP, 0)}) = <b>${fmt(c.ppv * 100, 1)}%</b>  ← 양성이 나온 사람이 실제로 아플 확률`;
  }
  text();
  api.readout = () => `유병률 ${fmt(prev, 1)}%, 민감도 ${fmt(sens, 1)}%, 특이도 ${fmt(spec, 1)}%일 때 P(양성|질병)=${fmt(sens, 1)}%이지만 P(질병|양성)=${fmt(calc().ppv * 100, 1)}%이다.`;
};

/* 08·09 지수 모델과 로지스틱 모델 */
LABS.model = (host, api, opt) => {
  const T = [...Array(15).keys()];
  const P = [4.3, 6.1, 9.8, 13.9, 21.0, 28.4, 39.6, 49.2, 61.8, 70.5, 80.1, 85.2, 91.0, 93.1, 96.4];
  let k = (opt && opt.k) || 15, K = 110, show = { e: true, l: true };
  const ctl = el("div", "row"); host.appendChild(ctl);
  const kS = slider(ctl, "모델을 만들 때 쓰는 자료 (앞에서부터)", 4, 15, 1, k, v => v + "개" + (v < 15 ? ` (t = 0~${v - 1})` : " (전부)"), v => { k = v; up(); });
  const KS = slider(ctl, "로지스틱 모델의 수용 한계 K", 60, 300, 1, K, v => String(v), v => { K = v; up(); });
  const c2 = el("div", "row"); host.appendChild(c2);
  check(c2, "지수 모델", true, v => { show.e = v; up(); });
  check(c2, "로지스틱 모델", true, v => { show.l = v; up(); });
  const lin = (xs, ys) => { const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n; let sxy = 0, sxx = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; }); const b = sxy / sxx; return [my - b * mx, b]; };
  function fit() {
    const t = T.slice(0, k), p = P.slice(0, k), Kmin = Math.max(...p) + 0.5, Ke = Math.max(K, Kmin);
    const [c, d] = lin(t, p.map(Math.log)), fe = x => Math.exp(c + d * x);
    const [a, b] = lin(t, p.map(v => Math.log(Ke / v - 1))), fl = x => Ke / (1 + Math.exp(a + b * x));
    const rmse = (f, idx) => idx.length ? Math.sqrt(idx.reduce((s, i) => s + (P[i] - f(T[i])) ** 2, 0) / idx.length) : NaN;
    const used = T.slice(0, k), held = T.slice(k);
    return { fe, fl, Ke, Kmin, eIn: rmse(fe, used), lIn: rmse(fl, used), eOut: rmse(fe, held), lOut: rmse(fl, held), d };
  }
  const cv = canvas(host, "16 / 9", (g, W, H, dpr) => {
    const F = fit(), o = { xmin: 0, xmax: 25, ymin: 0, ymax: 200 };
    const m = axes(g, W, H, dpr, o);
    g.fillStyle = "rgba(21,23,26,.05)"; g.fillRect(m.X(k - 0.5), m.T, m.X(25) - m.X(k - 0.5), g.canvas.height - m.T - m.B);
    if (show.l) curve(g, F.fl, o, m, "#2f6fd6", 2.4 * dpr);
    if (show.e) curve(g, F.fe, o, m, "#ff5a30", 2.4 * dpr);
    if (show.l) { g.setLineDash([4 * dpr, 4 * dpr]); g.strokeStyle = "rgba(47,111,214,.5)"; g.lineWidth = dpr; g.beginPath(); g.moveTo(m.X(0), m.Y(F.Ke)); g.lineTo(m.X(25), m.Y(F.Ke)); g.stroke(); g.setLineDash([]); }
    T.forEach(i => dot(g, m.X(i), m.Y(P[i]), 4 * dpr, i < k ? "#15171a" : "#fff", "#15171a", 1.5 * dpr));
    g.font = `${10 * dpr}px sans-serif`; g.fillStyle = "#6b6f74"; g.textAlign = "left"; g.textBaseline = "top";
    g.fillText("t (년)", m.X(23.2), m.Y(0) - 14 * dpr);
  });
  host.appendChild(el("div", "legend",
    `<span class="legend-item"><i style="background:#15171a"></i>모델에 쓴 자료</span><span class="legend-item"><i style="background:#fff;border:1.5px solid #15171a"></i>남겨 둔 자료(예측 확인용)</span><span class="legend-item"><i style="background:#ff5a30"></i>지수 모델 P = a·eᵇᵗ</span><span class="legend-item"><i style="background:#2f6fd6"></i>로지스틱 모델 P = K / (1 + e^(a+bt))</span>`));
  const ro = el("div", "ro"); host.appendChild(ro);
  host.appendChild(el("p", "panel-desc", "자료: 어느 섬의 토끼 개체 수(단위: 10마리)를 나타낸 <b>가상의 자료</b>입니다. 로지스틱 모델은 K를 정하면 나머지 계수를 자료에 맞춰 계산합니다."));
  function up() {
    const F = fit();
    if (K < F.Kmin) KS.set(Math.ceil(F.Kmin));
    cv.redraw();
    ro.innerHTML = `앞 ${k}개 자료로 만든 모델 · 쓴 자료에 대한 오차(RMSE): 지수 <b>${fmt(F.eIn)}</b>, 로지스틱 <b>${fmt(F.lIn)}</b><br>` +
      (k < 15 ? `남겨 둔 ${15 - k}개 자료 예측 오차: 지수 <b>${fmt(F.eOut)}</b>, 로지스틱 <b>${fmt(F.lOut)}</b><br>` : "") +
      `t = 25년 예측: 지수 <b>${fmt(F.fe(25), 0)}</b>, 로지스틱 <b>${fmt(F.fl(25), 0)}</b>` + (K < F.Kmin ? `<br><span class="warn">K는 쓴 자료의 최댓값보다 커야 해서 ${Math.ceil(F.Kmin)}로 맞췄습니다.</span>` : "");
  }
  up();
  api.readout = () => { const F = fit(); return `앞 ${k}개 자료, K=${Math.round(F.Ke)}: 쓴 자료 오차 지수 ${fmt(F.eIn)}·로지스틱 ${fmt(F.lIn)}` + (k < 15 ? `, 남긴 자료 예측 오차 지수 ${fmt(F.eOut)}·로지스틱 ${fmt(F.lOut)}` : "") + `, t=25 예측 지수 ${fmt(F.fe(25), 0)}·로지스틱 ${fmt(F.fl(25), 0)}.`; };
};

/* 10 평균·중앙값, 잘린 축 */
LABS.stats = (host, api) => {

  const med = a => { const s = a.slice().sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };

    g.strokeStyle = "#b9b3a7"; g.lineWidth = dpr; g.beginPath(); g.moveTo(L, y0); g.lineTo(W - R, y0); g.stroke();

    const stack = {}; d.forEach(v => { const key = Math.round(X(v) / (9 * dpr)); stack[key] = (stack[key] || 0) + 1; dot(g, X(v), y0 - 6 * dpr - (stack[key] - 1) * 11 * dpr, 4.5 * dpr, v === boss && incl ? "#15171a" : "#9a958a"); });
    const line = (v, c, t, dy) => { g.strokeStyle = c; g.lineWidth = 2 * dpr; g.beginPath(); g.moveTo(X(v), 8 * dpr); g.lineTo(X(v), y0); g.stroke(); g.fillStyle = c; g.font = `800 ${11 * dpr}px sans-serif`; g.textAlign = "left"; g.textBaseline = "top"; g.fillText(t, X(v) + 4 * dpr, dy * dpr); };
    line(mean(d), "#ff5a30", "평균 " + fmt(mean(d), 0), 8); line(med(d), "#2f6fd6", "중앙값 " + fmt(med(d), 0), 24);

    const o = { xmin: 0, xmax: 2, ymin: cut ? 46 : 0, ymax: 54 };

    [["A 후보", 52, "#ff5a30"], ["B 후보", 48, "#2f6fd6"]].forEach(([t, v, c], i) => {
      const x0 = m.X(i + 0.25), x1 = m.X(i + 0.75); g.fillStyle = c; g.fillRect(x0, m.Y(v), x1 - x0, m.Y(o.ymin) - m.Y(v));
      g.fillStyle = "#15171a"; g.font = `800 ${11 * dpr}px sans-serif`; g.textAlign = "center"; g.textBaseline = "bottom"; g.fillText(`${t} ${v}%`, (x0 + x1) / 2, m.Y(v) - 3 * dpr);
    });

  }

LABS.tech = (host, api) => {

  slider(ctl, "y 최댓값 (10의 거듭제곱)", 1, 16, 1, yk, v => "10^" + v, v => { yk = v; up(); });
  const h = x => x - 10 * Math.log(Math.abs(x));      // eˣ = x¹⁰ ⇔ x = 10·ln|x| (x ≠ 0)
  const bis = (a, b) => { let fa = h(a); for (let i = 0; i < 80; i++) { const m = (a + b) / 2, fm = h(m); if (fa * fm <= 0) b = m; else { a = m; fa = fm; } } return (a + b) / 2; };
  const roots = [bis(-1, -0.5), bis(1, 1.5), bis(30, 40)];
  const f = x => Math.exp(x), g2 = x => x ** 10;
  const visible = () => { const ym = 10 ** yk; return roots.filter(r => r >= xmin && r <= xmax && f(r) <= ym); };
  const cv = canvas(host, "16 / 9", (g, W, H, dpr) => {
    const ym = 10 ** yk, o = { xmin, xmax, ymin: -ym * 0.04, ymax: ym };
    const m = axes(g, W, H, dpr, { ...o, padL: 52 });
    curve(g, f, o, m, "#ff5a30", 2.2 * dpr); curve(g, g2, o, m, "#2f6fd6", 2.2 * dpr);
    visible().forEach(r => dot(g, m.X(r), m.Y(f(r)), 5 * dpr, "#15171a", "#fff", 1.5 * dpr));
  });
  host.appendChild(el("div", "legend", `<span class="legend-item"><i style="background:#ff5a30"></i>y = eˣ</span><span class="legend-item"><i style="background:#2f6fd6"></i>y = x¹⁰</span><span class="legend-item"><i style="background:#15171a"></i>이 창에서 보이는 교점</span>`));
  const ro = el("div", "ro"); host.appendChild(ro);
  function up() {
    if (xmax <= xmin) xmax = xmin + 1;
    cv.redraw();
    ro.innerHTML = `그래프 창 x ∈ [${xmin}, ${xmax}], y ≤ 10^${yk} 에서 보이는 교점: <b>${visible().length}개</b><br>` +
      `eˣ = x¹⁰ ⇔ x = 10·ln|x| 를 풀면 실제 교점은 <b>3개</b>: x ≈ ${roots.map(r => fmt(r, 4)).join(", ")}`;
  }
  up();
  api.readout = () => `창 x∈[${xmin},${xmax}], y≤10^${yk}에서는 교점이 ${visible().length}개 보였지만, 실제로는 x≈${roots.map(r => fmt(r, 3)).join(", ")}의 3개다.`;
};

LABS.numerals = (host, api) => {
  let v = 2026;
  const row = el("div", "row"); host.appendChild(row);
  const inp = el("input"); inp.type = "number"; inp.min = 1; inp.max = 3999; inp.value = v; inp.style.cssText = "width:9em;padding:9px 10px;border:1px solid #d3cec3;border-radius:10px;font-weight:800";
  inp.setAttribute("aria-label", "수 입력 (1~3999)"); row.append(el("span", "section-label", "수 입력 (1~3999)"), inp);
  inp.oninput = () => { const x = Math.round(+inp.value); if (x >= 1 && x <= 3999) { v = x; draw(); } };
  const out = el("div", "tbl-wrap"); out.style.maxHeight = "none"; host.appendChild(out);
  const ro = el("div", "ro"); host.appendChild(ro);
  const digits = (n, b) => { const d = []; while (n > 0) { d.unshift(n % b); n = Math.floor(n / b); } return d; };
  const roman = n => { const T = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]]; let s = ""; T.forEach(([a, r]) => { while (n >= a) { s += r; n -= a; } }); return s; };
  const HJ = "〇一二三四五六七八九", KR = ["", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];
  const hanja = n => { const P = ["千", "百", "十", ""], PK = ["천", "백", "십", ""]; const s = String(n).padStart(4, "0"); let h = "", k = ""; for (let i = 0; i < 4; i++) { const d = +s[i]; if (!d) continue; h += (d === 1 && i < 3 ? "" : HJ[d]) + P[i]; k += (d === 1 && i < 3 ? "" : KR[d]) + PK[i]; } return [h, k]; };
  function draw() {
    const [h, k] = hanja(v);
    const R = [
      ["10진법", String(v), "자릿값 1, 10, 100, 1000"],
      ["2진법", digits(v, 2).join(""), "컴퓨터가 쓰는 방식"],
      ["12진법", digits(v, 12).map(d => d < 10 ? d : "AB"[d - 10]).join(""), "A=10, B=11 (12개월, 1다스)"],
      ["20진법 (마야)", digits(v, 20).join(" · "), "자리마다 0~19 · 자릿값 1, 20, 400"],
      ["60진법 (바빌로니아)", digits(v, 60).join(" · "), "자리마다 0~59 · 시간의 분·초, 각도"],
      ["로마 숫자", roman(v), "0과 자릿값이 없는 덧셈·뺄셈식 표기"],
      ["한자 수", `${h} (${k})`, "자릿값 이름(十, 百, 千)을 붙이는 방식"]
    ];
    out.innerHTML = `<table class="tbl"><thead><tr><th>표기법</th><th>${v}의 표기</th><th>특징</th></tr></thead><tbody>${R.map(r => `<tr><td style="text-align:left;font-weight:800">${r[0]}</td><td style="text-align:left;font-family:ui-monospace,Consolas,monospace">${esc(r[1])}</td><td style="text-align:left;color:var(--muted)">${r[2]}</td></tr>`).join("")}</tbody></table>`;
    ro.innerHTML = `표기는 7가지로 다르지만 모두 같은 수 <b>${v}</b>을 나타냅니다.<br>${v}이 짝수인지, 3의 배수인지 같은 성질은 표기와 상관없이 같습니다: ${v % 2 ? "홀수" : "짝수"}, ${v % 3 ? "3의 배수 아님" : "3의 배수"}.`;
  }
  draw();
  api.readout = () => `${v}은 2진법 ${digits(v, 2).join("")}, 60진법 ${digits(v, 60).join("·")}, 로마 숫자 ${roman(v)}로 표기가 달라도 같은 수다.`;
};

LABS.weights = (host, api) => {
  const ST = [["가", 92, 70, 80], ["나", 85, 88, 90], ["다", 78, 95, 85], ["라", 88, 82, 60], ["마", 70, 92, 98], ["바", 95, 65, 75]];
  const NAMES = ["지필평가", "수행평가", "과제·태도"], BASE = [60, 30, 10];
  let w = BASE.slice();
  const ctl = el("div", "row"); host.appendChild(ctl);
  const sls = NAMES.map((t, i) => slider(ctl, t + " 비중", 0, 100, 5, w[i], v => v + "", v => { w[i] = v; draw(); }));
  const rb = el("button", "btn", "처음 비중(60·30·10)으로"); rb.type = "button"; rb.onclick = () => { w = BASE.slice(); sls.forEach((s, i) => s.set(w[i])); draw(); }; host.appendChild(rb);
  const tw = el("div", "tbl-wrap"); tw.style.maxHeight = "none"; host.appendChild(tw);
  const ro = el("div", "ro"); host.appendChild(ro);
  const rank = W => { const tot = W.reduce((a, b) => a + b, 0) || 1; const s = ST.map(r => ({ n: r[0], sc: (r[1] * W[0] + r[2] * W[1] + r[3] * W[2]) / tot })); const sorted = s.slice().sort((a, b) => b.sc - a.sc); s.forEach(x => x.rk = sorted.indexOf(x) + 1); return s; };
  function draw() {
    const now = rank(w), base = rank(BASE), tot = w.reduce((a, b) => a + b, 0);
    tw.innerHTML = `<table class="tbl"><thead><tr><th>학생</th>${NAMES.map(t => `<th>${t}</th>`).join("")}<th>환산 점수</th><th>순위</th><th>처음과 비교</th></tr></thead><tbody>` +
      now.slice().sort((a, b) => a.rk - b.rk).map(x => { const r = ST.find(s => s[0] === x.n), b = base.find(s => s.n === x.n), dlt = b.rk - x.rk;
        return `<tr class="${x.rk === 1 ? "hit" : ""}"><td>${x.n}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${fmt(x.sc, 1)}</td><td>${x.rk}위</td><td>${dlt > 0 ? "▲" + dlt : dlt < 0 ? "▼" + (-dlt) : "−"}</td></tr>`; }).join("") + "</tbody></table>";
    const top = now.find(x => x.rk === 1).n;
    ro.innerHTML = tot ? `비중 ${w.join(" : ")} → 1위 <b>${top}</b> (처음 비중 60 : 30 : 10일 때 1위 ${base.find(x => x.rk === 1).n})<br>계산은 어느 경우에나 정확합니다. 무엇이 달라졌을까요?` : `<span class="warn">비중을 하나 이상 0보다 크게 정하세요.</span>`;
  }
  draw();
  api.readout = () => { const now = rank(w); return `가중치 ${w.join(":")}에서 1위는 ${now.find(x => x.rk === 1).n}(처음 60:30:10에서는 ${rank(BASE).find(x => x.rk === 1).n}), 순위가 바뀐 학생 ${now.filter(x => x.rk !== rank(BASE).find(b => b.n === x.n).rk).length}명.`; };

  const api = { readout: () => "" };
  LABS[t.lab](labHost, api, t.labOpt);
  const logHd = el("div", "row"); logHd.style.justifyContent = "space-between";
  logHd.innerHTML = `<b style="font-size:13px">실험 결과 기록 (성찰의 근거)</b>`;
  const addB = el("button", "btn primary", "지금 결과를 기록에 추가"); addB.type = "button"; logHd.appendChild(addB); lb.appendChild(logHd);
  const logList = el("ol", "loglist"); lb.appendChild(logList);
  const drawLog = () => {
    logList.innerHTML = s.log.length ? "" : `<li style="list-style:none;margin-left:-1.2em;color:var(--muted)">아직 기록이 없습니다. 실험한 뒤 위 단추를 눌러 결과를 남기세요.</li>`;
    s.log.forEach((x, i) => { const li = el("li", null, esc(x)); const d = el("button", null, "삭제"); d.type = "button"; d.onclick = () => { s.log.splice(i, 1); save(); drawLog(); }; li.appendChild(d); logList.appendChild(li); });
  };
  addB.onclick = () => { const r = api.readout(); if (!r) { toast("먼저 실험을 해 보세요"); return; } if (s.log.length >= 8) { toast("기록은 8개까지 남길 수 있어요"); return; } s.log.push(r); save(); drawLog(); toast("기록에 추가했어요"); };
  drawLog();
  if (t.disc) lb.appendChild(el("div", "disc", `<b>토론 질문</b> ${esc(t.disc)}`));
  ws.appendChild(L);

  /* 오른쪽: TOK 질문 선택과 성찰 */
  const R = el("section", "panel");
  R.innerHTML = `<div class="panel-head"><div class="panel-title">② TOK 성찰</div><div class="panel-desc">성찰할 지식 질문을 하나 고르고, 실험 기록을 근거로 문장 틀을 채우세요.</div></div>`;
  const rb = el("div", "panel-body refl"); R.appendChild(rb);
  const qs = [["kq", t.kq, "이 활동의 지식 질문"]].concat(t.rel.filter(id => BANK_BY_ID[id]).map(id => [id, BANK_BY_ID[id].q, `AA 가이드 · ${BANK_BY_ID[id].unit}`]));
  const qBox = el("div"); rb.appendChild(qBox);
  qs.forEach(([id, q, src]) => {
    const l = el("label", "qopt" + (s.q === id ? " on" : ""), `<input type="radio" name="q-${t.id}" ${s.q === id ? "checked" : ""}><span><span class="src">${esc(src)}</span>${esc(q)}</span>`);
    $("input", l).onchange = () => { s.q = id; save(); $$(".qopt", qBox).forEach(x => x.classList.remove("on")); l.classList.add("on"); };
    qBox.appendChild(l);
  });
  const F = [["f1", "① 나는 처음에 ___라고 판단했다.", "직관이나 처음 생각: 예) 사례가 계속 맞으니 항상 성립할 것이다"],
             ["f2", "② 그러나 ___라는 근거·반례를 검토하면서 판단을 수정했다.", "왼쪽 실험 기록에서 판단을 바꾼 근거나 반례"],
             ["f3", "③ 따라서 이 지식은 ___라는 조건에서 신뢰할 수 있으며,", "어떤 가정·정의·범위 안에서 믿을 수 있는가"],
             ["f4", "④ ___까지 확대하여 주장하기는 어렵다.", "어디까지는 넘어서 주장할 수 없는가"],
             ["o", "다른 관점: 나와 다르게 생각할 사람은 무엇을 근거로 들까?", "다른 사람, 다른 문화, 다른 지식 영역(자연과학·인문학 등)의 관점"]];
  const sent = el("div", "sentence");
  F.forEach(([k, lab, ph]) => {
    const id = `${k}-${t.id}`;
    const l = el("label", null, esc(lab)); l.htmlFor = id; rb.appendChild(l);
    const ta = el("textarea"); ta.id = id; ta.placeholder = ph; ta.value = s[k] || "";
    ta.oninput = () => { s[k] = ta.value; save(); sent.innerHTML = sentenceOf(s); renderTabs(); };
    rb.appendChild(ta);
  });
  rb.appendChild(el("label", null, "완성된 성찰 문장"));
  sent.innerHTML = sentenceOf(s); rb.appendChild(sent);
  rb.appendChild(el("label", null, "스스로 점검하기"));
  const cb = el("div", "stack"); cb.style.gap = "6px"; rb.appendChild(cb);
  CRITERIA.forEach(([c, d], i) => {
    const l = el("label", "ck", `<input type="checkbox"${s.chk.includes(i) ? " checked" : ""}><span><b>${c}</b> <span style="font-weight:500;color:var(--muted)">${d}</span></span>`);
    $("input", l).onchange = e => { s.chk = s.chk.filter(x => x !== i); if (e.target.checked) s.chk.push(i); save(); };
    cb.appendChild(l);
  });
  ws.appendChild(R);

  const pg = el("div", "pager");
  const pv = el("button", "btn", idx > 0 ? `← TOK ${TOPICS[idx - 1].id} ${TOPICS[idx - 1].title}` : "← 탐구 활동 목록"); pv.type = "button";
  pv.onclick = () => go(idx > 0 ? { n: "topic", id: TOPICS[idx - 1].id } : { n: "home" });
  const nx = el("button", "btn primary", idx < TOPICS.length - 1 ? `TOK ${TOPICS[idx + 1].id} ${TOPICS[idx + 1].title} →` : "내 성찰 보고서 →"); nx.type = "button";
  nx.onclick = () => go(idx < TOPICS.length - 1 ? { n: "topic", id: TOPICS[idx + 1].id } : { n: "report" });
  pg.append(pv, nx); w.appendChild(pg);
}

function bank(w) {
  const p = el("section", "panel");
  p.innerHTML = `<div class="panel-head"><div class="panel-title">「수학: 분석과 접근 가이드(지식이론)」 질문 은행</div><div class="panel-desc">AA 다섯 영역과 단원별로 정리했습니다. <b>지식이론</b> 질문과 함께 <b style="color:#2f6fd6">국제적 소양</b> 항목도 있습니다. 관련 활동이 있으면 바로 갈 수 있어요.</div></div>`;
  const b = el("div", "panel-body stack"); p.appendChild(b); w.appendChild(p);
  const s = el("input", "search"); s.type = "search"; s.placeholder = "낱말로 찾기: 예) 직관, 모델, 문화, 윤리, 무한"; s.value = bankQ; s.setAttribute("aria-label", "질문 검색"); b.appendChild(s);
  const f = el("div", "chips"); b.appendChild(f);
  ["", ...AREAS].forEach(a => { const c = el("button", "chip" + (a === areaFilter ? " on" : ""), a || "전체 영역"); c.type = "button"; c.onclick = () => { areaFilter = a; list(); $$(".chip", f).forEach(x => x.classList.toggle("on", x === c)); }; f.appendChild(c); });
  const out = el("div"); b.appendChild(out);
  const usedBy = id => TOPICS.filter(t => t.rel.includes(id));
  function list() {
    const q = bankQ.trim();
    let html = "", n = 0;
    AREAS.filter(a => !areaFilter || a === areaFilter).forEach(a => {
      let ah = "";
      BANK.filter(g => g.area === a).forEach(g => {
        const items = g.qs.filter(x => !q || x[2].includes(q) || g.unit.includes(q));
        if (!items.length) return;
        ah += `<div class="bank-unit">${esc(g.unit)}</div>` + items.map(([id, k, text]) => {
          n++; const u = usedBy(id);
          return `<div class="bank-q"><span class="k ${k === "IM" ? "im" : ""}">${k === "IM" ? "국제적 소양" : k === "CTX" ? "다른 맥락" : "지식이론"}</span>${esc(text)}${u.length ? `<div class="links">${u.map(t => `<button type="button" data-go="${t.id}">TOK ${t.id} ${esc(t.title)} 활동으로</button>`).join("")}</div>` : ""}</div>`;
        }).join("");
      });
      if (ah) html += `<div class="bank-group"><h3>${a}</h3>${ah}</div>`;
    });
    out.innerHTML = html || `<div class="note">“${esc(q)}”가 들어간 질문이 없습니다.</div>`;
    $$("[data-go]", out).forEach(x => x.onclick = () => go({ n: "topic", id: x.dataset.go }));
  }
  s.oninput = () => { bankQ = s.value; list(); };
  list();
}

function reportText() {
  const L = [`[IB AA · 지식이론(TOK) 성찰 보고서]`, `이름: ${S.name || "(미입력)"}   날짜: ${new Date().toLocaleDateString("ko-KR")}`, ""];
  const used = TOPICS.filter(t => { const s = S.t[t.id]; return s && (filled(t.id) || s.log.length || (s.o || "").trim()); });
  if (!used.length) L.push("(아직 작성한 활동이 없습니다)");
  used.forEach(t => {
    const s = S.t[t.id];
    L.push(`■ TOK ${t.id}. ${t.title} (${t.area})`);
    L.push(`지식 질문: ${chosenQ(t, s)}`);
    L.push(`수학 질문: ${t.mq}`);
    L.push(`실험 결과 기록:`); (s.log.length ? s.log : ["(없음)"]).forEach((x, i) => L.push(`  ${s.log.length ? i + 1 + ") " : ""}${x}`));
    L.push(`성찰: ${plainSentence(s)}`);
    L.push(`다른 관점: ${(s.o || "").trim() || "(미작성)"}`);
    L.push(`스스로 점검: ${CRITERIA.map((c, i) => (s.chk.includes(i) ? "☑ " : "☐ ") + c[0]).join("  ")}`);
    L.push("");
  });
  return L.join("\n");
}
function report(w) {
  const p = el("section", "panel");
  p.innerHTML = `<div class="panel-head"><div class="panel-title">내 성찰 보고서</div><div class="panel-desc">작성한 활동이 자동으로 모입니다. 복사하거나 파일로 저장해 선생님이 안내한 곳에 제출하세요.</div></div>`;
  const b = el("div", "panel-body stack"); p.appendChild(b); w.appendChild(p);
  const nr = el("div", "name-row", `<label for="nm" style="font-weight:800;font-size:13px">이름</label><input id="nm" type="text" maxlength="30" placeholder="학번 이름">`);
  b.appendChild(nr);
  const nm = $("input", nr); nm.value = S.name || "";
  const box = el("div", "report"); b.appendChild(box);
  const refresh = () => { box.textContent = reportText(); };
  nm.oninput = () => { S.name = nm.value; save(); refresh(); };
  refresh();
  const act = el("div", "row"); b.appendChild(act);
  const cp = el("button", "btn primary", "보고서 복사"); cp.type = "button";
  cp.onclick = () => {
    const txt = reportText();
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(box); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("글을 선택했어요. 복사해서 쓰세요"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("보고서를 복사했어요"), fallback); else fallback();
  };
  const dl = el("button", "btn", "텍스트 파일로 저장"); dl.type = "button";
  dl.onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([reportText()], { type: "text/plain;charset=utf-8" }));
    a.download = `TOK_성찰_${(S.name || "이름없음").trim().replace(/[\\/:*?"<>|\s]+/g, "_")}.txt`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const clr = el("button", "btn danger", "모든 기록 지우기"); clr.type = "button";
  clr.onclick = () => { if (!confirm("이 브라우저에 저장된 TOK 실험 기록과 성찰을 모두 지울까요? 되돌릴 수 없어요.")) return; S = { name: "", t: {} }; save(); render(); };
  act.append(cp, dl, clr);
}

function render() {
  renderTabs();
  viewEl.innerHTML = "";
  if (view.n === "topic") { const t = TOPICS.find(x => x.id === view.id); if (t) topic(viewEl, t); else home(viewEl); }
  else if (view.n === "bank") bank(viewEl);
  else if (view.n === "report") report(viewEl);
  else home(viewEl);
}
render();
</script>
</body>
</html>
