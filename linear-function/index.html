<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일차함수 그래프 탐구</title>
<style>
  /* ===== 내 수학 실험실 공통 테마 =====
     이 :root 블록과 아래 "공통 셸" 영역은 모든 도구가 동일하게 유지합니다.
     도구별 CSS는 파일 아래쪽 "도구 전용" 영역에만 추가하세요. */
  :root{
    --bg:#f2f0e9;
    --panel:#fbf9f3;
    --panel-2:#f4f1e9;
    --line:#d8d2c7;
    --border-soft:#eee9df;
    --text:#15171a;
    --muted:#6b6f74;
    --faint:#9a958a;
    --accent:#ff5a30;
    --accent-weak:rgba(255,90,48,.14);
    --lime:#d9f24f;
    --shadow:0 10px 28px rgba(21,23,26,.055);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      linear-gradient(rgba(21,23,26,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(21,23,26,.035) 1px, transparent 1px),
      var(--bg);
    background-size:34px 34px;
    color:var(--text);
    font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    letter-spacing:-.015em;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;color:inherit}
  .num{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  .app{width:100%;max-width:1180px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}

  /* ---- 공통 셸: 상단바 ---- */
  .topbar{
    min-height:72px;
    display:flex;
    gap:14px;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    background:rgba(242,240,233,.90);
    border:1px solid var(--line);
    border-radius:18px;
    backdrop-filter:blur(14px);
  }
  .brand-area{display:flex;align-items:center;gap:18px;min-width:0}
  .home-link{
    display:flex;align-items:center;gap:10px;flex:none;
    color:var(--text);text-decoration:none;
    padding:7px 10px 7px 8px;border-radius:12px;
    transition:background .18s ease;
  }
  .home-link:hover{background:#e7e3d9}
  .home-arrow{
    width:31px;height:31px;border:1px solid #c9c4b8;border-radius:50%;
    display:grid;place-items:center;font-size:16px;line-height:1;background:#fbf9f3;
  }
  .brand-copy{display:block;line-height:1.15}
  .brand-copy strong{display:block;font-size:14px;font-weight:800;letter-spacing:-.035em}
  .brand-copy small{
    display:block;margin-top:4px;color:#8a8d90;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:7.5px;letter-spacing:.13em;white-space:nowrap;
  }
  .top-divider{width:1px;height:34px;background:#d3cec3;flex:none}
  .title-row{display:block;min-width:0}
  .eyebrow{
    display:flex;align-items:center;gap:7px;margin-bottom:4px;
    color:#7b7770;font-size:10px;font-weight:750;white-space:nowrap;
  }
  .eyebrow span{display:block;width:18px;height:2px;background:var(--accent)}
  h1{
    font-size:clamp(18px,1.25vw,24px);
    margin:0;
    font-weight:800;letter-spacing:-.04em;white-space:nowrap;
  }
  h1 em{
    font-style:normal;font-weight:500;
    background:linear-gradient(transparent 60%,var(--lime) 0);
    padding:0 .04em;
  }
  .subtitle{margin:4px 0 0;color:#666b6f;font-size:11.5px}
  .badge{
    display:inline-flex;align-items:center;gap:7px;flex:none;
    background:#15171a;color:#fff;border:0;
    border-radius:999px;padding:8px 12px;font-weight:700;font-size:12px;white-space:nowrap;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#73c48f}

  /* ---- 공통 셸: 패널 ----
     기본은 "넓은 그림 영역 + 좁은 설정 영역" 2단입니다.
     패널 수가 다르면 grid-template-columns만 바꾸고, 좁은 화면에서 1단으로
     떨어지는 @media (max-width:900px) 규칙은 남겨 두세요. */
  .workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:10px}
  .panel{
    min-width:0;
    display:flex;flex-direction:column;
    background:rgba(251,249,243,.96);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .panel-head{
    flex:0 0 auto;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    background:rgba(247,244,236,.92);
  }
  .panel-title{
    font-size:15px;font-weight:800;letter-spacing:-.025em;
    position:relative;padding-left:10px;
  }
  .panel-title::before{
    content:"";position:absolute;left:0;top:.15em;bottom:.15em;
    width:3px;border-radius:3px;background:var(--accent);
  }
  .panel-desc{color:#74716b;font-size:11.5px;margin-top:5px;line-height:1.45}
  .panel-body{flex:1;min-height:0;padding:14px}

  /* ---- 공통 셸: 버튼 ---- */
  .btn{
    border:1px solid #c9c4b8;background:#fbf9f3;color:#15171a;
    border-radius:999px;font-weight:700;font-size:12.5px;
    padding:9px 14px;cursor:pointer;line-height:1;
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px);border-color:#15171a;background:#f2efe6}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.primary{background:#15171a;color:#fff;border-color:#15171a}
  .btn.primary:hover:not(:disabled){background:#2b2e31}
  .btn.danger{color:#a73b2c}
  .btn.icon-btn{width:38px;height:38px;padding:0;border-radius:10px;font-size:18px;display:grid;place-items:center}

  /* ---- 공통 셸: 그림 영역 (캔버스·SVG) ---- */
  .chart-wrap{background:#fff;border:1px solid #e3ded4;border-radius:12px;overflow:hidden;position:relative}
  .chart-wrap canvas,.chart-wrap svg{display:block;width:100%;height:100%}

  /* ---- 공통 셸: 입력·지표·안내 (쓰지 않는 것은 지우세요) ---- */
  .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .control{display:flex;flex-direction:column;gap:5px}
  .control label{font-size:11px;color:var(--muted);font-weight:800}
  .control input{
    width:100%;padding:9px 10px;font-weight:700;
    border:1px solid #d3cec3;background:#fff;color:var(--text);border-radius:10px;
  }
  .control input:focus{outline:3px solid rgba(217,242,79,.42);border-color:#9aa64b}
  .control input[type="range"]{
    padding:0;height:22px;border:0;border-radius:0;background:transparent;
    accent-color:#15171a;cursor:pointer;
  }
  .checkbox-control{
    justify-content:center;min-height:58px;padding:8px 10px;
    border:1px solid var(--line);background:var(--panel-2);border-radius:12px;
  }
  .checkbox-control label{display:flex;align-items:center;gap:8px;color:var(--text);cursor:pointer;font-size:11px}
  .checkbox-control input{width:17px;height:17px;padding:0;accent-color:#15171a;cursor:pointer}

  .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .metric{background:var(--panel-2);border:1px solid #ddd7cc;border-radius:11px;padding:8px 9px;min-width:0}
  .metric .label{color:#77736d;font-size:10px;font-weight:800;margin-bottom:3px}
  .metric .value{
    font-size:15px;font-weight:850;color:var(--text);
    font-variant-numeric:tabular-nums;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .formula{
    background:#15171a;color:#f6f2e9;border:1px solid #15171a;border-radius:12px;
    padding:9px 10px;line-height:1.55;font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow:auto;
  }
  .note{
    padding:10px 12px;border-radius:10px;
    background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    font-size:11px;line-height:1.5;
  }
  .note b{color:#7c2d12;font-weight:800}
  .status{min-height:19px;font-size:11px;line-height:1.4;font-weight:750;color:var(--muted)}
  .status.ok{color:#32724f}
  .status.error{color:#b44634}

  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .legend-item i{width:11px;height:11px;border-radius:3px;flex:none}

  /* ---- 공통 셸: 반응형 (이 3개 블록은 그대로 유지) ----
     주의: .topbar에 align-items:stretch를 쓰면 알약 모양 .badge가
     줄바꿈된 제목 높이만큼 세로로 늘어나 거대한 원처럼 깨집니다. */
  @media (max-width:1080px){
    .brand-copy small{display:none}
    .brand-copy strong{font-size:13px}
    .top-divider{height:28px}
  }
  @media (max-width:900px){
    .workspace{grid-template-columns:1fr}
  }
  @media (max-width:820px){
    .topbar{align-items:flex-start}
    .brand-area{align-items:flex-start}
    .home-link{padding-left:2px}
    .top-divider{display:none}
    .brand-copy{display:none}
    .title-row{display:block}
    h1{white-space:normal}
    .eyebrow{white-space:normal}
    .badge{display:none}
  }
  @media (max-width:520px){
    .app{padding:7px}
    .topbar{border-radius:14px;padding:9px 10px}
    .home-arrow{width:34px;height:34px}
    h1{font-size:20px;line-height:1.25}
    .subtitle{font-size:11px;white-space:normal}
    .panel{border-radius:14px}
    .panel-head{padding:12px}
    .btn{min-height:40px}
    .controls{grid-template-columns:1fr}
  }


  /* ===== 도구 전용 CSS는 여기부터 ===== */
  .chart-wrap{aspect-ratio:1/1;width:100%;max-width:min(560px,calc(100vh - 160px));margin:0 auto}
  .eq{font-size:26px;font-weight:850;letter-spacing:-.02em;text-align:center;padding:14px 8px;
       background:#fff;border:1px solid #e3ded4;border-radius:12px}
  .eq .a{color:var(--accent)} .eq .b{color:#2f6fd6}
  .range-row{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
  .control .val{float:right;color:var(--text)}
  .questions{margin:0;padding-left:18px;font-size:12.5px;line-height:1.75;color:#3d4044}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand-area">
      <!-- 홈으로 돌아가는 링크: ../#tools 를 바꾸지 마세요 -->
      <a class="home-link" href="../#tools" aria-label="메인으로">
        <span class="home-arrow">←</span>
        <span class="brand-copy">
          <strong data-site="name">내 수학 실험실</strong>
          <small data-site="englishName">MATHEMATICS LABORATORY</small>
        </span>
      </a>
      <span class="top-divider" aria-hidden="true"></span>
      <div class="title-row">
        <div class="eyebrow"><span></span>수학2 · 일차함수</div>
        <h1>일차함수 <em>그래프 탐구</em></h1>
        <p class="subtitle">기울기 a와 y절편 b를 바꾸며 y = ax + b의 그래프를 관찰합니다.</p>
      </div>
    </div>
    <div class="badge"><span class="dot"></span><span id="stateBadge">준비됨</span></div>
  </div>

  <div class="workspace">
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">좌표평면</div>
        <div class="panel-desc">주황색 선이 현재 그래프, 점선은 y = x 기준선입니다.</div>
      </div>
      <div class="panel-body">
        <div class="chart-wrap"><canvas id="plot"></canvas></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">값 바꾸기</div>
        <div class="panel-desc">슬라이더를 움직이면 그래프가 바로 바뀝니다.</div>
      </div>
      <div class="panel-body" style="display:flex;flex-direction:column;gap:12px">
        <div class="eq num" id="eq"></div>
        <div class="control">
          <label for="a">기울기 a <span class="val num" id="aVal"></span></label>
          <input id="a" type="range" min="-4" max="4" step="0.25" value="1">
          <div class="range-row"><span>-4</span><span>0</span><span>4</span></div>
        </div>
        <div class="control">
          <label for="b">y절편 b <span class="val num" id="bVal"></span></label>
          <input id="b" type="range" min="-6" max="6" step="0.5" value="2">
          <div class="range-row"><span>-6</span><span>0</span><span>6</span></div>
        </div>
        <div class="metrics">
          <div class="metric"><div class="label">기울기</div><div class="value num" id="mSlope"></div></div>
          <div class="metric"><div class="label">y절편</div><div class="value num" id="mY"></div></div>
          <div class="metric"><div class="label">x절편</div><div class="value num" id="mX"></div></div>
          <div class="metric"><div class="label">그래프 방향</div><div class="value" id="mDir"></div></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" type="button" id="trace">현재 그래프 남기기</button>
          <button class="btn" type="button" id="clear">남긴 그래프 지우기</button>
          <button class="btn primary" type="button" id="reset">처음으로</button>
        </div>
        <div class="note">
          <ol class="questions">
            <li>a를 음수로 바꾸면 그래프는 어떻게 달라지나요?</li>
            <li>b만 바꿀 때 그래프의 기울어진 정도는 변하나요?</li>
            <li>a = 0이면 어떤 그래프가 되나요?</li>
          </ol>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- 홈페이지 이름을 site-config.js에서 가져와 상단에 표시합니다 -->
<script src="../site-config.js"></script>
<script>
  if (typeof SITE !== "undefined") {
    document.querySelectorAll("[data-site]").forEach(el => {
      if (SITE[el.dataset.site]) el.textContent = SITE[el.dataset.site];
    });
  }
</script>
<script>
  // ===== 도구 전용 JavaScript는 여기부터 =====
  const canvas = document.getElementById("plot");
  const ctx = canvas.getContext("2d");
  const aIn = document.getElementById("a"), bIn = document.getElementById("b");
  const R = 8;                 // 좌표 범위 -8 ~ 8
  let traces = [];

  const fmt = v => {
    const r = Math.round(v * 100) / 100;
    return (Object.is(r, -0) ? 0 : r).toString();
  };

  function resize() {
    const box = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = box.width * dpr; canvas.height = box.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    const sx = x => (x + R) / (2 * R) * W;
    const sy = y => H - (y + R) / (2 * R) * H;
    const a = +aIn.value, b = +bIn.value;
    ctx.clearRect(0, 0, W, H);

    // 격자
    ctx.lineWidth = 1;
    for (let i = -R; i <= R; i++) {
      ctx.strokeStyle = i === 0 ? "#15171a" : "#ece8df";
      ctx.lineWidth = i === 0 ? 1.4 : 1;
      ctx.beginPath(); ctx.moveTo(sx(i), 0); ctx.lineTo(sx(i), H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, sy(i)); ctx.lineTo(W, sy(i)); ctx.stroke();
    }
    ctx.fillStyle = "#9a958a"; ctx.font = "11px ui-monospace, monospace";
    for (let i = -R + 2; i < R; i += 2) {
      if (i === 0) continue;
      ctx.fillText(i, sx(i) - 4, sy(0) + 14);
      ctx.fillText(i, sx(0) + 5, sy(i) + 4);
    }
    ctx.fillText("O", sx(0) + 5, sy(0) + 14);

    const line = (m, c, color, width, dash) => {
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);
      ctx.beginPath(); ctx.moveTo(sx(-R), sy(m * -R + c)); ctx.lineTo(sx(R), sy(m * R + c)); ctx.stroke();
      ctx.restore();
    };
    line(1, 0, "#c9c4b8", 1.2, [5, 5]);
    traces.forEach(t => line(t.a, t.b, "rgba(47,111,214,.45)", 2));
    line(a, b, "#ff5a30", 3.2);

    // y절편 점
    ctx.fillStyle = "#2f6fd6";
    ctx.beginPath(); ctx.arc(sx(0), sy(b), 5.5, 0, Math.PI * 2); ctx.fill();
    if (a !== 0) {
      ctx.fillStyle = "#15171a";
      ctx.beginPath(); ctx.arc(sx(-b / a), sy(0), 4.5, 0, Math.PI * 2); ctx.fill();
    }
    update(a, b);
  }

  function update(a, b) {
    const aTxt = a === 1 ? "" : a === -1 ? "-" : fmt(a);
    let rhs = a === 0 ? "" : `<span class="a">${aTxt}</span>x`;
    if (b !== 0 || a === 0) rhs += (b < 0 ? " − " : (a === 0 ? "" : " + ")) + `<span class="b">${fmt(Math.abs(b))}</span>`;
    if (a === 0 && b < 0) rhs = `<span class="b">-${fmt(Math.abs(b))}</span>`;
    document.getElementById("eq").innerHTML = "y = " + rhs;
    document.getElementById("aVal").textContent = fmt(a);
    document.getElementById("bVal").textContent = fmt(b);
    document.getElementById("mSlope").textContent = fmt(a);
    document.getElementById("mY").textContent = fmt(b);
    document.getElementById("mX").textContent = a === 0 ? (b === 0 ? "모든 x" : "없음") : fmt(-b / a);
    document.getElementById("mDir").textContent = a > 0 ? "오른쪽 위 ↗" : a < 0 ? "오른쪽 아래 ↘" : "수평 →";
    document.getElementById("stateBadge").textContent = `a = ${fmt(a)}, b = ${fmt(b)}`;
  }

  aIn.addEventListener("input", draw);
  bIn.addEventListener("input", draw);
  document.getElementById("trace").addEventListener("click", () => { traces.push({ a: +aIn.value, b: +bIn.value }); draw(); });
  document.getElementById("clear").addEventListener("click", () => { traces = []; draw(); });
  document.getElementById("reset").addEventListener("click", () => { aIn.value = 1; bIn.value = 2; traces = []; draw(); });
  window.addEventListener("resize", resize);
  resize();
</script>
</body>
</html>
